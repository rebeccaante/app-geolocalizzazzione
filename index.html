<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Timbrature QTECH</title>
    <!-- Tailwind CSS, Supabase e SheetJS per Excel -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header con Selezione Mese/Anno dallo Storico -->
        <header class="flex justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Gestione Presenze e Trasferte</h1>
                <p class="text-sm text-slate-500">Report mensile e calcolo automatico orari di cantiere</p>
            </div>
            
            <div class="flex items-center space-x-3 bg-slate-50 p-2 rounded-lg border">
                <label class="text-xs font-semibold text-slate-600 uppercase">Storico:</label>
                <select id="selectMese" class="bg-white border text-sm rounded-md px-3 py-1.5">
                    <option value="1">Gennaio</option><option value="2">Febbraio</option><option value="3">Marzo</option>
                    <option value="4">Aprile</option><option value="5">Maggio</option><option value="6">Giugno</option>
                    <option value="7">Luglio</option><option value="8">Agosto</option><option value="9">Settembre</option>
                    <option value="10" selected>Ottobre</option><option value="11">Novembre</option><option value="12">Dicembre</option>
                </select>
                <select id="selectAnno" class="bg-white border text-sm rounded-md px-3 py-1.5">
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                </select>
                <button id="btnCaricaStorico" class="bg-slate-800 text-white text-sm px-4 py-1.5 rounded-md hover:bg-slate-700">Visualizza</button>
            </div>
        </header>

        <!-- Caricamento Nuovo Excel -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold mb-3">Carica File Timbrature (.xlsx)</h2>
            <div class="flex items-center space-x-4">
                <input type="file" id="fileInput" accept=".xlsx, .xls" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
                <button id="btnElabora" class="bg-blue-600 text-white font-medium px-6 py-2 rounded-md hover:bg-blue-700 whitespace-nowrap">Elabora e Salva</button>
            </div>
        </section>

        <!-- Tabella Risultati Essenziale -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-100 text-slate-700 font-semibold border-b">
                        <tr>
                            <th class="p-3">Dipendente</th>
                            <th class="p-3">Giorno Entrata</th>
                            <th class="p-3">Ora Entrata</th>
                            <th class="p-3">Giorno Uscita</th>
                            <th class="p-3">Ora Uscita</th>
                            <th class="p-3">Luogo Partenza</th>
                            <th class="p-3">Luogo Cantiere</th>
                            <th class="p-3 text-center">Km Percorsi</th>
                            <th class="p-3 text-center">Ore Target</th>
                            <th class="p-3 text-center">Ore Effettuate</th>
                            <th class="p-3">Note</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200">
                        <!-- Popolato via JS -->
                    </tbody>
                    <tfoot id="tableFooter" class="bg-slate-900 text-white font-semibold">
                        <!-- Riga con la media finale -->
                    </tfoot>
                </table>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
